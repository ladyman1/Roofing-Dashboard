version: '3.8'

services:
  app:
    build: .
    container_name: roofing-dashboard-app
    restart: unless-stopped
    ports:
      - "3999:3999"
    environment:
      - NODE_ENV=production
      - PORT=3999
      - DATABASE_URL=postgresql://roofing_user:roofing_secret_pass@db:5432/roofing_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  db:
    image: postgres:16-alpine
    container_name: roofing-dashboard-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=roofing_user
      - POSTGRES_PASSWORD=roofing_secret_pass
      - POSTGRES_DB=roofing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roofing_user -d roofing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
